<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#071327"><title>نبض نت MAX ULTRA</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#113b60 0,#071327 55%);color:#f5fbff;font:15px system-ui,Tahoma;min-height:100vh;padding:22px}h1{font-size:24px;text-align:center;margin:6px 0;color:#4be8ff}.sub{text-align:center;color:#91b9cd;margin:0 0 24px}.sphere{height:145px;width:145px;border-radius:50%;margin:20px auto;position:relative;background:radial-gradient(circle at 30% 25%,#4ce5ff,#0a4380 42%,#031022 73%);box-shadow:0 0 55px #089bd866;display:grid;place-items:center;font-size:64px;animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 68px #00ebff88}}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#0a233b;border:1px solid #245675;border-radius:17px;padding:17px;text-align:center}.card small{display:block;color:#9fc6d9}.card b{font-size:25px;display:block;margin-top:5px;color:#55f5ef}button{border:0;background:linear-gradient(120deg,#06e7f2,#2995ff);color:#062336;border-radius:13px;padding:15px;font-size:15px;font-weight:900;width:100%;margin:7px 0}button:disabled{opacity:.6}.secondary{background:#112b42;color:#c4f4ff;border:1px solid #26698a}.status{text-align:center;color:#b5d8e6;padding:13px;min-height:50px}progress{width:100%;height:12px;accent-color:#4ff3fa}.foot{text-align:center;font-size:11px;color:#85aabd;margin-top:14px}</style></head><body><h1>⚡ نبض نت MAX ULTRA</h1><p class="sub">قياس تنزيل مباشر • 10 اختبارات • تحديثات مجانية</p><div class="sphere">🌐</div><div class="stats"><div class="card"><small>السرعة الحالية</small><b id="speed">0.0</b><small>Mbps</small></div><div class="card"><small>إجمالي التنزيل</small><b id="usage">0.0</b><small>MB</small></div></div><p class="status" id="status">جاهز للقياس</p><progress id="progress" value="0" max="10"></progress><button id="start">🚀 بدء 10 اختبارات</button><button id="bg" class="secondary">📲 قياس بالخلفية مع إشعار</button><button id="update" class="secondary">🔄 تحديث نبض نت بضغطة واحدة</button><div class="foot">الاختبارات تستهلك بيانات حقيقية • Android قد يوقف العمل الطويل بالخلفية</div><script>
const $=s=>document.getElementById(s),ROOT='https://raw.githubusercontent.com/ammar100050000-netizen/ammar/main/nabdh-net/version.json';let busy=false,stopped=false;
function nativeCall(f){try{if(window.NabdhAndroid&&typeof window.NabdhAndroid[f]==='function')return window.NabdhAndroid[f]();}catch(e){}return null}
$('bg').onclick=()=>{nativeCall('start');$('status').textContent='تم طلب تشغيل القياس بالخلفية؛ تابع الإشعار';};
$('start').onclick=async()=>{if(busy){stopped=true;return;}busy=true;stopped=false;$('start').textContent='إيقاف القياس';$('progress').value=0;let total=0;try{for(let test=1;test<=10&&!stopped;test++){let bytes=0,t=performance.now();$('status').textContent='الاختبار '+test+' من 10';let controller=new AbortController();let timer=setTimeout(()=>controller.abort(),18000);try{let resp=await fetch('https://speed.cloudflare.com/__down?bytes=5000000&t='+Date.now()+'&n='+test,{cache:'no-store',signal:controller.signal});if(!resp.ok)throw Error('HTTP '+resp.status);let reader=resp.body.getReader();while(!stopped){let v=await reader.read();if(v.done)break;bytes+=v.value.length;total+=v.value.length;let sec=Math.max(.01,(performance.now()-t)/1000);$('speed').textContent=(bytes*8/sec/1e6).toFixed(1);$('usage').textContent=(total/1e6).toFixed(1)}}finally{clearTimeout(timer);controller.abort();}$('progress').value=test;}}catch(e){$('status').textContent='فشل الاتصال: '+e.message}finally{busy=false;$('start').textContent='🚀 بدء 10 اختبارات';if(!stopped&&$('progress').value===10)$('status').textContent='اكتملت الاختبارات';}};
$('update').onclick=async()=>{$('status').textContent='جاري فحص التحديثات...';try{let r=await fetch(ROOT+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let m=await r.json();if(Number(m.versionCode)>19&&/^https:\/\//.test(m.apkUrl||'')){if(window.NabdhAndroid)nativeCall('openRelease');else location.href=m.releasePage||m.apkUrl;return}let url='https://raw.githack.com/ammar100050000-netizen/ammar/main/nabdh-net/index.html';if(location.href.startsWith('file:'))location.href=url+'?t='+Date.now();else location.href=url+'?t='+Date.now();$('status').textContent='تطبيقك محدّث؛ تحديث الواجهة الآن';}catch(e){$('status').textContent='تعذر الاتصال بالخادم: '+e.message}};
</script></body></html>
