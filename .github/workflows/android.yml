name: Build Nabdh Net APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NabdhNet_MAX_ULTRA.apk
      - name: Publish free APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v27
          name: Nabdh Net MAX ULTRA v27
          files: NabdhNet_MAX_ULTRA.apk
          make_latest: true
          draft: false
          prerelease: false