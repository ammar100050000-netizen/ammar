name: Verify and publish Nabdh Net V22
on:
  push:
    paths:
      - '.github/workflows/release-v22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          cat releases/v22/apk.part{0,1,2,3,4}.b64 | base64 -d > NabdhNet_MAX_ULTRA.apk
          echo "ec4447c44e955d5f14953dba65fa0076dc90a1d3b199d27c890f83bcf2cf7305  NabdhNet_MAX_ULTRA.apk" | sha256sum --check --status
          unzip -t NabdhNet_MAX_ULTRA.apk | tail -1
          test "$(stat -c%s NabdhNet_MAX_ULTRA.apk)" = "685209"
      - name: Verify APK signature and zip alignment using official Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$TOOLS"
          "$TOOLS" verify --verbose --print-certs --min-sdk-version 26 NabdhNet_MAX_ULTRA.apk | tee signature_report.txt
          grep -qi "V2 Signer: certificate SHA-256 digest: 11b838bc93f964a150c76f81d58407a5373b1ea51c861fb5b5ed05a54e931997" signature_report.txt
          "${TOOLS%/*}/zipalign" -c -v 4 NabdhNet_MAX_ULTRA.apk
      - name: Publish validated APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v22
          name: "نبض نت PULSE ONE V22 — إصلاح التثبيت"
          body: |
            Signed APK with the same signing identity as V20.
            Supports updating V20 without deleting existing user data.
            Interface updates from GitHub with one tap after installation.
          files: NabdhNet_MAX_ULTRA.apk
          draft: false
          prerelease: false
          make_latest: true
