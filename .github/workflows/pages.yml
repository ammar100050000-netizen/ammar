name: Verify Nabdh Net free update hosting
on:
  push:
    paths:
      - 'nabdh-net/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live HTML delivery
        run: |
          curl -fLsS --retry 2 --max-time 30 'https://raw.githack.com/ammar100050000-netizen/ammar/main/nabdh-net/index.html' -o /tmp/nabdh.html
          grep -q 'نبض نت MAX ULTRA' /tmp/nabdh.html
      - name: Verify update manifest delivery
        run: |
          curl -fLsS --retry 2 --max-time 30 'https://raw.githubusercontent.com/ammar100050000-netizen/ammar/main/nabdh-net/version.json' -o /tmp/version.json
          python3 -c "import json; j=json.load(open('/tmp/version.json')); assert j['versionCode']>=19 and j['apkUrl'].startswith('https://')"
