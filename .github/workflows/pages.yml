name: Verify Nabdh Net live design and updates
on:
  push:
    paths:
      - 'nabdh-net/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published PULSE ONE interface
        run: |
          curl -fLsS --retry 2 --max-time 30 'https://raw.githubusercontent.com/ammar100050000-netizen/ammar/main/nabdh-net/index.html' -o /tmp/nabdh.html
          grep -q 'pulse-ui-v21' /tmp/nabdh.html
          grep -q 'nb_lifetime_v5' /tmp/nabdh.html
      - name: Verify CORS for Android WebView live updates
        run: |
          curl -fsSI -H 'Origin: null' 'https://raw.githubusercontent.com/ammar100050000-netizen/ammar/main/nabdh-net/index.html' >/tmp/headers
          grep -i 'access-control-allow-origin:' /tmp/headers
      - name: Verify current update manifest
        run: |
          curl -fLsS --retry 2 --max-time 30 'https://raw.githubusercontent.com/ammar100050000-netizen/ammar/main/nabdh-net/version.json' -o /tmp/version.json
          python3 -c "import json; j=json.load(open('/tmp/version.json')); assert j['versionCode']>=21 and j['apkUrl'].startswith('https://github.com/')"
